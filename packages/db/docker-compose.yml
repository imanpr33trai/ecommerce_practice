name: ecommerce-practice

services:
  postgres:
    image: postgres
    container_name: ecommerce-practice-postgres
    environment:
      POSTGRES_DB: ecommerce-practice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ecommerce-practice_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ecommerce-practice_postgres_data: