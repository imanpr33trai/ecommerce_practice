name: Scheduled Maintenance

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  # ==========================================
  # Dependency Updates Check
  # ==========================================
  check-updates:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install

      - name: Check for outdated packages
        run: bun outdated || true

      - name: Create issue for outdated dependencies
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Weekly Dependency Update Check';
            const body = `This is an automated check for outdated dependencies.

            Please run \`bun outdated\` locally to see which packages need updates.

            Timestamp: ${new Date().toISOString()}`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['dependencies', 'maintenance']
            });
        continue-on-error: true

  # ==========================================
  # Security Audit
  # ==========================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install

      - name: Run security audit
        run: bun audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          if [ -f audit-report.json ]; then
            CRITICAL=$(cat audit-report.json | jq '[.advisories[] | select(.severity == "critical")] | length' || echo "0")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::Found $CRITICAL critical vulnerabilities!"
              exit 1
            fi
          fi
        continue-on-error: true

  # ==========================================
  # Base Image Updates
  # ==========================================
  check-base-images:
    name: Check Base Image Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for base image updates
        uses: luke14free/dive-action@v1
        with:
          image: oven/bun:1.3.3-alpine
        continue-on-error: true

      - name: Create issue if base images are outdated
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dockerfile = fs.readFileSync('docker/Dockerfile', 'utf8');

            // Extract base image versions
            const bunVersion = dockerfile.match(/FROM oven\/bun:(.+)-alpine/)?.[1];
            const nodeVersion = dockerfile.match(/FROM node:(.+)-alpine/)?.[1];

            const title = 'Docker Base Image Version Check';
            const body = `Current base image versions:
            - Bun: ${bunVersion}
            - Node: ${nodeVersion}

            Please check if newer versions are available and update accordingly.

            Timestamp: ${new Date().toISOString()}`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['docker', 'maintenance']
            });
        continue-on-error: true

  # ==========================================
  # Cleanup Old Artifacts
  # ==========================================
  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10

      - name: Delete old container images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
        continue-on-error: true
