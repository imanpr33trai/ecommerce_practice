
services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  server:
    build:
      target: builder
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps/server:/app/apps/server

    build:
      target: builder
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - web_node_modules:/app/node_modules
    command: ["npm", "run", "dev"]

volumes:
  postgres_dev_data:
    driver: local
  server_node_modules:
    driver: local
  web_node_modules:
    driver: local