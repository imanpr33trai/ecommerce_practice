# ================================
# Application Docker Compose
# ================================

services:
  # ================================
  # Hono Backend Server
  # ================================
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server.production
    container_name: ecommerce-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-12345}@postgres:5432/${POSTGRES_DB:-ecommerce}}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      # Better Auth Configuration
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-secret-key-at-least-32-characters-long}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
    networks:
      - ecommerce-network
    volumes:
      - server_logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  # ================================
  # Next.js Frontend
  # ================================
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web.production
    container_name: ecommerce-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://server:3000}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-12345}@postgres:5432/${POSTGRES_DB:-ecommerce}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - ecommerce-network
    volumes:
      - web_logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"

# ================================
# Networks
# ================================
networks:
  ecommerce-network:
    external: true
    name: ecommerce-network

# ================================
# Volumes
# ================================
volumes:
  server_logs:
    driver: local
    name: ecommerce-server-logs
  web_logs:
    driver: local
    name: ecommerce-web-logs
