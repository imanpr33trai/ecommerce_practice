packages:
  - 'apps/*'
  - 'packages/*'

# Optimizations for monorepo
catalogs:
  # Shared dependencies catalog for version alignment
  react18:
    react: '^18.2.0'
    'react-dom': '^18.2.0'
    '@types/react': '^18.2.0'
    '@types/react-dom': '^18.2.0'
  
  react19:
    react: '^19.2.3'
    'react-dom': '^19.2.3'
    '@types/react': '^19.2.2'
    '@types/react-dom': '^19.2.2'

  typescript:
    typescript: '^5.8.2'
    '@types/node': '^20.11.17'

# Link shared packages to reduce duplication
link-workspace-packages: true
prefer-workspace-packages: true

# Enable shamefully-hoist for compatibility with tools that expect node_modules structure
shamefully-hoist: false

# Store node_modules in root to reduce duplication
# Remove comment to enable: node-linker: isolated
node-linker: isolated
